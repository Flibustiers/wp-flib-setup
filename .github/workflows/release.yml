name: Contrôle et release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: php -l flib-setup.php

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version du fichier = version du tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n -E "s/^const FLIB_SETUP_VERSION *= *'([^']+)'.*/\1/p" flib-setup.php)
          [[ "$tag" == "$ver" ]] || { echo "Tag $tag ≠ FLIB_SETUP_VERSION $ver"; exit 1; }
      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          files: flib-setup.php
