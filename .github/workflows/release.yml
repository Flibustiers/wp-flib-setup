name: Contrôle et release

# - Chaque push / pull request : vérification de la syntaxe PHP (7.4 à 8.4).
# - Push sur main : si la version FLIB_SETUP_VERSION n'a pas encore de release,
#   le tag vX.Y.Z et la release (avec flib-setup.php) sont créés automatiquement.
#   Pour publier une nouvelle version : monter FLIB_SETUP_VERSION + CHANGELOG, pousser sur main.
# - Le jeton GitHub (secret de dépôt FLIB_GITHUB_TOKEN) est intégré au fichier de la release
#   uniquement, jamais dans le code versionné.
# - Après un changement de jeton : Actions › « Contrôle et release » › Run workflow
#   (le fichier de la release existante est reconstruit avec le nouveau jeton).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: php -l flib-setup.php

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version du fichier
        id: version
        run: |
          ver=$(sed -n -E "s/^const FLIB_SETUP_VERSION *= *'([^']+)'.*/\1/p" flib-setup.php)
          [[ -n "$ver" ]] || { echo "FLIB_SETUP_VERSION introuvable"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release v$ver existe déjà : rien à publier."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier ?
        id: publish
        run: |
          if [[ "${{ steps.version.outputs.exists }}" == "false" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Intégration du jeton GitHub
        if: steps.publish.outputs.go == 'true'
        env:
          TOKEN: ${{ secrets.FLIB_GITHUB_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::Secret FLIB_GITHUB_TOKEN absent : fichier publié sans jeton intégré."
            exit 0
          fi
          [[ "$TOKEN" =~ ^[A-Za-z0-9_]+$ ]] || { echo "::error::Le secret FLIB_GITHUB_TOKEN contient des caractères inattendus."; exit 1; }
          sed -i -E "s/^const FLIB_SETUP_EMBEDDED_TOKEN = '';/const FLIB_SETUP_EMBEDDED_TOKEN = '${TOKEN}';/" flib-setup.php
          grep -q "^const FLIB_SETUP_EMBEDDED_TOKEN = '[A-Za-z0-9_]\+';" flib-setup.php || { echo "::error::Intégration du jeton impossible."; exit 1; }
          php -l flib-setup.php
      - name: Notes de version (section du CHANGELOG)
        if: steps.publish.outputs.go == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## "v { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "Voir le CHANGELOG." > notes.md
      - name: Publication
        if: steps.publish.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: flib-setup.php ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: flib-setup.php
